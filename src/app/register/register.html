<div class="container-fluid vh-100">
  <div class="row h-100">

    <!-- Left Panel -->
    <div class="col-md-6 d-none d-md-flex justify-content-center align-items-center p-0">
      <img src="" class="img-fluid h-100 w-100 object-fit-cover" alt="Register Image">
    </div>

    <!-- Right Panel -->
    <div class="col-md-6 d-flex justify-content-center align-items-center bg-light">
      <div class="card shadow p-4" style="max-width: 380px; width: 100%;">
        <h3 class="text-center mb-4">Create Account</h3>

        <!-- Username -->
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" [(ngModel)]="username">
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="email">
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" [(ngModel)]="password">
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control" [(ngModel)]="confirmPassword">
        </div>

        <button class="btn btn-primary w-100 mb-3" (click)="register()">Register</button>

        <div class="text-center">
          <span class="small">
            Already have an account?
            <a [routerLink]="['']" class="text-decoration-none">Login</a>
          </span>
        </div>
      </div>
    </div>

  </div>
</div>

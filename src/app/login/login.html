<div class="fullscreen-img">
  <div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
      <h3 class="text-center mb-4">Login</h3>

      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" [(ngModel)]="username">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" [(ngModel)]="password">
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <a [routerLink]="['/forgotpassword']" class="text-decoration-none small">Forgot Password?</a>
      </div>

      <button class="btn btn-primary w-100" (click)="login()">Login</button>

      <div class="text-center mt-3">
        <span class="small">Don't have an account? <a [routerLink]="['/register']"
            class="text-decoration-none">Register</a>
        </span>
      </div>
    </div>
  </div>
</div>
